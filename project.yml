name: ClickBait

options:
  bundleIdPrefix: org.clickbait
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  ClickBaitCore:
    path: ClickBaitCore
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 1.1.0

targets:
  ClickBait:
    type: application
    platform: macOS
    sources:
      - path: ClickBait
    dependencies:
      - package: ClickBaitCore
      - package: WhisperKit
    info:
      path: ClickBait/Info.plist
      properties:
        CFBundleDisplayName: ClickBait
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 ClickBait contributors. GNU AGPL-3.0."
        NSServices:
          - NSMenuItem:
              default: Remember with ClickBait
            NSMessage: rememberSelection
            NSPortName: ClickBait
            NSSendTypes:
              - NSStringPboardType
              - public.utf8-plain-text
        NSMicrophoneUsageDescription: "ClickBait listens while you hold Control+Option so it can hear your question, or fn+Control so it can type what you say."
        NSCameraUsageDescription: "ClickBait shows your camera in its notch Mirror while you have it open. Nothing is recorded or saved."
        NSAppleEventsUsageDescription: "ClickBait controls Finder, Notes and System Events to carry out your commands, like making a note or switching Dark Mode, and Music or Spotify from its notch panel."
        NSRemindersFullAccessUsageDescription: "ClickBait adds reminders when you ask it to. With Morning suggestions on, it reads today's reminders on this Mac to suggest what to ask."
        NSCalendarsFullAccessUsageDescription: "With Morning suggestions on, ClickBait reads today's events on this Mac to suggest what to ask."
        NSRemindersUsageDescription: "ClickBait adds reminders when you ask it to."
    entitlements:
      path: ClickBait/ClickBait.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.clickbait.ClickBait
        PRODUCT_NAME: ClickBait
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

  ClickBaitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClickBaitTests
    dependencies:
      - target: ClickBait
      - package: ClickBaitCore
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.clickbait.ClickBaitTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ClickBait.app/Contents/MacOS/ClickBait
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  ClickBait:
    build:
      targets:
        ClickBait: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ClickBaitCore/ClickBaitCoreTests
        - ClickBaitTests
