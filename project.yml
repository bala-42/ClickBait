name: ClickBait

options:
  bundleIdPrefix: org.clickbait
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  ClickBaitCore:
    path: ClickBaitCore
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 1.1.0

targets:
  ClickBait:
    type: application
    platform: macOS
    sources:
      - path: ClickBait
    dependencies:
      - package: ClickBaitCore
      - package: WhisperKit
    info:
      path: ClickBait/Info.plist
      properties:
        CFBundleDisplayName: ClickBait
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 ClickBait contributors. Apache License 2.0."
        NSMicrophoneUsageDescription: "ClickBait listens while you hold Control+Option so it can hear your question."
        NSAppleEventsUsageDescription: "ClickBait controls Finder, Notes and System Events to carry out your commands, like making a note or switching Dark Mode, and Music or Spotify from its notch panel."
        NSCalendarsFullAccessUsageDescription: "ClickBait's notch calendar shows events for the date you select. They stay on this Mac."
        NSCalendarsUsageDescription: "ClickBait's notch calendar shows events for the date you select."
        NSRemindersFullAccessUsageDescription: "ClickBait shows reminders for the date selected in its notch calendar. It may also add reminders when you ask it to."
        NSRemindersUsageDescription: "ClickBait shows reminders for the date selected in its notch calendar and may add reminders when you ask it to."
    entitlements:
      path: ClickBait/ClickBait.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.clickbait.ClickBait
        PRODUCT_NAME: ClickBait
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

schemes:
  ClickBait:
    build:
      targets:
        ClickBait: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ClickBaitCore/ClickBaitCoreTests
