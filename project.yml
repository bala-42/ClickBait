name: ClickBait

options:
  bundleIdPrefix: org.clickbait
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  ClickBaitCore:
    path: ClickBaitCore
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 1.1.0
  # Kokoro voices (MIT; Kokoro's weights are Apache 2.0): MLX, with Misaki for pronunciation
  # (no eSpeak, which is GPL).
  KokoroSwift:
    url: https://github.com/mlalma/kokoro-ios.git
    exactVersion: 1.0.11
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.30.2
  MLXUtilsLibrary:
    url: https://github.com/mlalma/MLXUtilsLibrary.git
    exactVersion: 0.0.6

targets:
  ClickBait:
    type: application
    platform: macOS
    sources:
      - path: ClickBait
    dependencies:
      - package: ClickBaitCore
      - package: WhisperKit
      - package: KokoroSwift
        embed: true  # a dynamic framework: copied into the app, or it crashes at launch
      - package: MLXSwift
        product: MLX
      - package: MLXUtilsLibrary
    info:
      path: ClickBait/Info.plist
      properties:
        CFBundleDisplayName: ClickBait
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: false
        NSHumanReadableCopyright: "Copyright © 2026 ClickBait contributors. GNU AGPL-3.0."
        NSServices:
          - NSMenuItem:
              default: Remember with ClickBait
            NSMessage: rememberSelection
            NSPortName: ClickBait
            NSSendTypes:
              - NSStringPboardType
              - public.utf8-plain-text
        NSMicrophoneUsageDescription: "ClickBait listens while you hold Control+Option so it can hear your question, or fn+Control so it can type what you say."
        NSAudioCaptureUsageDescription: "ClickBait sets each app's volume in its mixer: it takes that app's sound and plays it at the level you choose. Nothing is recorded or leaves your Mac."
        NSCameraUsageDescription: "ClickBait shows your camera in its notch Mirror while you have it open. Photos you take are kept only if you save or drag them out."
        NSAppleEventsUsageDescription: "ClickBait controls Finder, Notes and System Events to carry out your commands, like making a note or switching Dark Mode, and Music or Spotify from its notch panel."
        NSRemindersFullAccessUsageDescription: "ClickBait adds reminders when you ask it to. With Morning suggestions on, it reads today's reminders on this Mac to suggest what to ask."
        NSCalendarsFullAccessUsageDescription: "With Morning suggestions on, ClickBait reads today's events on this Mac to suggest what to ask."
        NSRemindersUsageDescription: "ClickBait adds reminders when you ask it to."
        NSPhotoLibraryUsageDescription: "With “Search the Photos library” on, ClickBait reads your photos on this Mac so “find the picture of the airport” can find them. Nothing leaves your Mac."
    entitlements:
      path: ClickBait/ClickBait.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.clickbait.ClickBait
        PRODUCT_NAME: ClickBait
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ClickBaitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClickBaitTests
    dependencies:
      - target: ClickBait
      - package: ClickBaitCore
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.clickbait.ClickBaitTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ClickBait.app/Contents/MacOS/ClickBait
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  ClickBait:
    build:
      targets:
        ClickBait: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ClickBaitCore/ClickBaitCoreTests
        - ClickBaitTests
