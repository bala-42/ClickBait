name: ClickBait

options:
  bundleIdPrefix: org.clickbait
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  ClickBaitCore:
    path: ClickBaitCore
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 1.1.0

targets:
  ClickBait:
    type: application
    platform: macOS
    sources:
      - path: ClickBait
    dependencies:
      - package: ClickBaitCore
      - package: WhisperKit
    info:
      path: ClickBait/Info.plist
      properties:
        CFBundleDisplayName: ClickBait
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 ClickBait contributors. Apache License 2.0."
        NSMicrophoneUsageDescription: "ClickBait listens while you hold Control+Option so it can hear your question."
    entitlements:
      path: ClickBait/ClickBait.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.clickbait.ClickBait
        PRODUCT_NAME: ClickBait
        ENABLE_HARDENED_RUNTIME: YES
        # Xcode drops the runtime flag for ad-hoc ("-") signing; force it so local builds
        # behave like release builds (and the audio-input entitlement actually matters).
        OTHER_CODE_SIGN_FLAGS: "--options=runtime"
        # With hardened runtime + ad-hoc signing, library validation refuses Xcode's separate
        # preview dylib (no shared Team ID). Link everything into the main binary instead.
        ENABLE_DEBUG_DYLIB: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

schemes:
  ClickBait:
    build:
      targets:
        ClickBait: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ClickBaitCore/ClickBaitCoreTests
